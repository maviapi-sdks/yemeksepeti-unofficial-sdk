[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yemeksepeti-unofficial-sdk"
version = "0.1.0"
description = "Unofficial Yemeksepeti API client"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["yemeksepeti", "yemeksepeti-api", "unofficial", "sdk", "maviapi"]

[project.urls]
Homepage = "https://maviapi.com/apis/yemeksepeti"
Repository = "https://github.com/maviapi-sdks/yemeksepeti-unofficial-sdk"

[tool.setuptools]
packages = ["yemeksepeti_sdk"]
